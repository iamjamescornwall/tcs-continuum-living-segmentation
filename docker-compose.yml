version: '3.8'

services:
  continuum-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: continuum-living-segmentation
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production

